[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-risk-sentinel"
version = "0.1.0"
description = "Track 2 AI Risk Manager: transaction, customer, and terminal risk intelligence."
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: requires the downloaded Handbook dataset in data/raw (skipped when absent)",
]
